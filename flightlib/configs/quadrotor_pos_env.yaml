quadrotor_env:
  sim_dt: 0.02
  max_t: 100.0
  control_mode: ctbr   # motor | ctbr
  world_box: [[-100, 100.0], [-100.0, 100.0], [0.0, 100.0]]  # [x_min,x_max],[y_min,y_max],[z_min,z_max]
  init_pos: [5.5, 6.5, 60.0]                   # base reset position [x,y,z]
  randomize_position_on_reset: true
  randomize_position_scale: 10.0   # scale for position noise around init_pos
  randomize_velocity_on_reset: false
  randomize_velocity_scale: 1.0   # scale for initial linear velocity noise
  randomize_attitude_on_reset: false   # false -> start level (identity quaternion)
  randomize_attitude_scale: 1.0   # attitude random scale (used only when randomize_attitude_on_reset=true)
  camera:
     # Camera pose in quadrotor body frame (B -> C)
     # pos [0.0, 0.0, -0.3] quaternion [0.7071, -0.7071, 0.0, 0.0] -> 아래 보기
     # pos [0.0, 0.0, 0.3] quaternion [1.0, 0.0, 0.0, 0.0] -> 앞에 보기
    rel_pos: [0.0, 0.0, -0.3]           # [x, y, z] meters
    rel_quat_wxyz: [0.7071, -0.7071, 0.0, 0.0]  # quaternion [w, x, y, z]
    width: 256
    height: 256
    fov: 70.0
    log_world_pose: false
    log_world_pose_interval_steps: 50
    # 3 QR tag centers in world frame
    tag_centers_world:
      - [5.5, 6.5, 3.0]
      - [-2.3, 4.1, 3.0]
      - [-0.6, 8.0, 3.0]
    # For each tag: 4 corners in world frame (p0->p1->p2->p3)
    # shape: [[[x,y,z] x4] x3]
    tag_corners_world:
      - # tag 0
        - [9.5, 2.5, 3.0]
        - [1.5, 2.5, 3.0]
        - [1.5, 10.5, 3.0]
        - [9.5, 10.5, 3.0]
      - # tag 1
        - [-0.3, 2.1, 3.0]
        - [-4.3, 2.1, 3.0]
        - [-4.3, 6.1, 3.0]
        - [-0.3, 6.1, 3.0]
      - # tag 2
        - [0.4, 7.0, 3.0]
        - [-1.6, 7.0, 3.0]
        - [-1.6, 9.0, 3.0]
        - [ 0.4, 9.0, 3.0]
    # Backward-compatible single-tag keys (optional)
    tag_center_world: [5.5, 6.5, 3.0]
    tag_corner_world:
      - [9.5, 2.5, 3.0]
      - [1.5, 2.5, 3.0]
      - [1.5, 10.5, 3.0]
      - [9.5, 10.5, 3.0]

quadrotor_dynamics:
  mass: 0.73
  arm_l: 0.17
  motor_omega_min: 150.0 # motor rpm min
  motor_omega_max: 3000.0 # motor rpm max
  motor_tau: 0.0001 # motor step response
  thrust_map: [1.3298253500372891e-06, 0.0038360810526746033, 
      -1.7689986848125325]
  kappa: 0.016 # rotor drag coeff
  omega_max: [6.0, 6.0, 6.0]  # body rate constraint (x, y, z) 

rl:
  ######terminal 조건######################################################################
  landing_terminal_z: 3.02  #consider terminted when z<terminal_Z
  landing_tilt_hard: 10 #terminate when tilt exceeds this [radian]


  ######Terminal reward######################################################################
  landing_failure_reward: -100.0
  landing_tilt_hard_penalty: -20.0 # penalty when exceeding landing tilt


  ########### 로그 ##############
  log_interval_steps: 1 # ___ step 마다 로그 출력

  ####### reward ###########################################################################
  centering_w_xy: 0 # xy centering reward weight toward the target tag
  centering_xy_reward_scale: 0.2 # scale factor in reward_xy = w_xy / (1 + scale * xy_error)
  centering_w_z: 0.00 # z-axis tracking penalty weight while centering
  centering_w_tilt: 0.0 # tilt penalty weight; larger tilt gets penalized more strongly
  centering_survival_reward: 0.5 # constant reward added every alive step during centering
  centering_w_action_hover: 0.0 # penalty weight for deviation from the centering hover action [0, 0, 0, 0]

  tag_center_coeff: 0.0 # positive reward from image-plane tag center proximity to the screen center
  tag_center_progress_coeff: 100.0 # positive reward when image-plane center error decreases compared to the previous step
  tag_area_coeff: 0.0 # reward when observed tag area is close to tag_target_area
  tag_shape_coeff: 100.0 # reward when tag edges are aligned with the image x/y axes
  tag_target_area: 300.0 # desired tag area in image pixels^2
  tag_area_error_scale: 3.0 # larger -> area reward peaks more sharply around tag_target_area
  tag_shape_error_scale: 8.0 # larger -> shape reward drops much faster when edges are not parallel to image x/y axes
  tag_missing_penalty: 100.0 # penalty applied when tag center/corners are unavailable in the observation

  ###############설정값#############################################################
  hold_last_tag_obs: false # whether to hold the last observed tag pose when the tag is not observed (e.g., during landing when the tag is on the ground and not visible)
  include_prev_action: 4 # append the last N actions to PPO observation (0 disables action history)
  include_area_obs: false # append the tag area metric to PPO observation in the Python wrapper
  include_shape_obs: false # append the tag shape metric to PPO observation in the Python wrapper
  include_tag_id_obs: false # include tag_id in the tag block passed to PPO
  include_real_p_c_obs: false # append world-derived real p_C=[x,y,z] to PPO observation in the Python wrapper
  use_projected_uv_out_of_view: true # if true, use projected uv values even when the tag is outside the image, as long as the projection is valid
